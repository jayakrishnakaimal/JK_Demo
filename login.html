<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Headless AI Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background: linear-gradient(160deg, #f8fafd 0%, #f3f6fb 25%, #ddeaf5 55%, #b8d4e8 75%, #9ec8e0 100%);
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  /* ── ambient orbs (match headless.html canvas tab) ── */
  .orb {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(70px);
    opacity: 0.25;
    animation: orbDrift 12s ease-in-out infinite alternate;
  }
  .orb-1 { width: 420px; height: 420px; background: #93c5fd; top: -120px; right: -80px; animation-delay: 0s; }
  .orb-2 { width: 320px; height: 320px; background: #a5b4fc; bottom: -80px; left: -60px; animation-delay: 3s; }
  .orb-3 { width: 260px; height: 260px; background: #7dd3fc; top: 40%; left: 50%; animation-delay: 6s; }
  @keyframes orbDrift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(30px, 20px) scale(1.08); }
  }

  /* ── card ── */
  .card {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 16px;
    padding: 48px 44px 40px;
    box-shadow: 0 4px 32px rgba(59,130,246,0.08), 0 1px 4px rgba(0,0,0,0.06);
  }

  /* ── logo row ── */
  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 36px;
  }
  .logo-ring {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #fff;
    border: 1.5px solid #bfdbfe;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .logo-ring img { width: 26px; height: 26px; object-fit: contain; }
  .logo-wordmark {
    font-size: 15px;
    font-weight: 600;
    color: #111827;
    letter-spacing: -0.2px;
  }
  .logo-wordmark span {
    font-weight: 400;
    color: #6b7280;
  }

  /* ── heading ── */
  .card-title {
    font-size: 24px;
    font-weight: 400;
    color: #111827;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .card-sub {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 32px;
    line-height: 1.5;
  }

  /* ── form fields ── */
  .field {
    margin-bottom: 18px;
  }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: #374151;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .field-wrap {
    position: relative;
  }
  .field-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: #9ca3af;
    pointer-events: none;
    display: flex;
  }
  .field input {
    width: 100%;
    height: 44px;
    padding: 0 14px 0 38px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: #111827;
    background: #fff;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
  }
  .field input::placeholder { color: #9ca3af; }
  .field input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
  }
  .field input.error {
    border-color: #ef4444;
    box-shadow: 0 0 0 3px rgba(239,68,68,0.10);
  }

  /* live first-name preview badge */
  .name-preview {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 7px;
    font-size: 12px;
    color: #2563eb;
    font-weight: 500;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s, transform 0.2s;
  }
  .name-preview.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .name-preview-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #2563eb;
    flex-shrink: 0;
  }

  /* error message */
  .field-error {
    font-size: 12px;
    color: #ef4444;
    margin-top: 6px;
    display: none;
  }
  .field-error.visible { display: block; }

  /* ── submit button ── */
  .btn-submit {
    width: 100%;
    height: 46px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
    position: relative;
    overflow: hidden;
    transition: background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-submit:hover:not(:disabled) { background: #1d4ed8; }
  .btn-submit:active:not(:disabled) { transform: scale(0.98); }
  .btn-submit:disabled { background: #93c5fd; cursor: default; }

  /* ripple */
  @keyframes ripple { to { transform: scale(5); opacity: 0; } }
  .ripple-el {
    position: absolute; border-radius: 50%;
    width: 60px; height: 60px;
    margin-top: -30px; margin-left: -30px;
    background: rgba(255,255,255,0.35);
    pointer-events: none;
    animation: ripple 0.6s ease-out forwards;
  }

  /* spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  /* ── divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 20px;
    color: #d1d5db;
    font-size: 12px;
    color: #9ca3af;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    border-top: 1px solid #e5e7eb;
  }

  /* ── SSO button ── */
  .btn-sso {
    width: 100%;
    height: 44px;
    background: #fff;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    color: #374151;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-sso:hover { background: #f9fafb; border-color: #9ca3af; }

  /* ── footer note ── */
  .card-footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
    line-height: 1.6;
  }
  .card-footer a {
    color: #2563eb;
    text-decoration: none;
  }
  .card-footer a:hover { text-decoration: underline; }

  /* ── success overlay ── */
  @keyframes successFade {
    0%   { opacity: 0; transform: scale(0.95); }
    60%  { transform: scale(1.02); }
    100% { opacity: 1; transform: scale(1); }
  }
  .success-overlay {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(4px);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .success-overlay.visible {
    opacity: 1;
    pointer-events: all;
    animation: successFade 0.35s cubic-bezier(.4,0,.2,1) both;
  }
  .success-check {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: #dcfce7;
    display: flex; align-items: center; justify-content: center;
  }
  .success-check svg { color: #16a34a; }
  .success-name {
    font-size: 20px;
    font-weight: 400;
    color: #111827;
    letter-spacing: -0.2px;
  }
  .success-sub {
    font-size: 13px;
    color: #6b7280;
  }
</style>
</head>
<body>

<!-- ambient orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="card">

  <!-- logo -->
  <div class="logo-row">
    <div class="logo-ring">
      <img src="ini_logo.png" alt="IBM Network Intelligence logo" />
    </div>
    <div class="logo-wordmark">IBM Network Intelligence</div>
  </div>

  <!-- heading -->
  <h1 class="card-title">Welcome back</h1>
  <p class="card-sub">Sign in to your workspace to continue.</p>

  <!-- form -->
  <form id="loginForm" novalidate>

    <div class="field">
      <label for="emailInput">Work email</label>
      <div class="field-wrap">
        <span class="field-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="4" width="20" height="16" rx="3" stroke="#9ca3af" stroke-width="1.6" fill="none"/>
            <path d="M2 8l10 6 10-6" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <input
          type="email"
          id="emailInput"
          placeholder="you@company.com"
          autocomplete="email"
          spellcheck="false"
        />
      </div>
      <!-- live first-name preview -->
      <div class="name-preview" id="namePreview">
        <span class="name-preview-dot"></span>
        <span id="namePreviewText">Signing in as …</span>
      </div>
      <div class="field-error" id="emailError">Please enter a valid email address.</div>
    </div>

    <div class="field">
      <label for="passwordInput">Password</label>
      <div class="field-wrap">
        <span class="field-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="11" width="14" height="10" rx="2" stroke="#9ca3af" stroke-width="1.6" fill="none"/>
            <path d="M8 11V7a4 4 0 018 0v4" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <input
          type="password"
          id="passwordInput"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>
      <div class="field-error" id="passwordError">Password must be at least 6 characters.</div>
    </div>

    <button class="btn-submit" type="submit" id="submitBtn">
      <span id="btnLabel">Sign in</span>
    </button>

  </form>

  <div class="divider">or</div>

  <button class="btn-sso" onclick="ssoClick(event)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
      <path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
    </svg>
    Continue with SSO
  </button>

  <p class="card-footer">
    By signing in you agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
  </p>

  <!-- success overlay -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-check">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M5 13l4 4L19 7" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="success-name" id="successName">Welcome, …</div>
    <div class="success-sub">Taking you to your dashboard…</div>
  </div>

</div><!-- /card -->

<script>
  /* ── helpers ── */
  function extractFirstName(email) {
    const local = email.split('@')[0];           // e.g. "jayakrishna.kaimal" or "jayakrishna"
    const part  = local.split(/[._\-+]/)[0];     // take first segment before . _ - +
    return part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
  }

  function isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
  }

  /* ── live first-name preview as user types email ── */
  const emailInput   = document.getElementById('emailInput');
  const namePreview  = document.getElementById('namePreview');
  const namePreviewText = document.getElementById('namePreviewText');

  emailInput.addEventListener('input', () => {
    const val = emailInput.value.trim();
    if (val.includes('@') && isValidEmail(val)) {
      const first = extractFirstName(val);
      namePreviewText.textContent = 'Signing in as ' + first;
      namePreview.classList.add('visible');
    } else if (val.length > 2) {
      const tentative = extractFirstName(val);
      namePreviewText.textContent = 'Signing in as ' + tentative + '…';
      namePreview.classList.add('visible');
    } else {
      namePreview.classList.remove('visible');
    }
    // clear error on typing
    document.getElementById('emailError').classList.remove('visible');
    emailInput.classList.remove('error');
  });

  document.getElementById('passwordInput').addEventListener('input', () => {
    document.getElementById('passwordError').classList.remove('visible');
    document.getElementById('passwordInput').classList.remove('error');
  });

  /* ── ripple helper ── */
  function spawnRipple(btn, e) {
    const r    = document.createElement('span');
    r.className = 'ripple-el';
    const rect = btn.getBoundingClientRect();
    r.style.left = (e.clientX - rect.left) + 'px';
    r.style.top  = (e.clientY - rect.top)  + 'px';
    btn.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  }

  /* ── SSO placeholder ── */
  function ssoClick(e) {
    const btn = e.currentTarget;
    btn.textContent = 'Redirecting to SSO…';
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z" stroke="#9ca3af" stroke-width="1.5" fill="none"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20" stroke="#9ca3af" stroke-width="1.5" fill="none"/></svg>Continue with SSO`;
      btn.disabled = false;
    }, 1800);
  }

  /* ── form submit ── */
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const emailVal    = emailInput.value.trim();
    const passwordVal = document.getElementById('passwordInput').value;
    const btn         = document.getElementById('submitBtn');
    let   valid       = true;

    // validate email
    if (!isValidEmail(emailVal)) {
      document.getElementById('emailError').classList.add('visible');
      emailInput.classList.add('error');
      emailInput.focus();
      valid = false;
    }

    // validate password
    if (passwordVal.length < 6) {
      document.getElementById('passwordError').classList.add('visible');
      document.getElementById('passwordInput').classList.add('error');
      if (valid) document.getElementById('passwordInput').focus();
      valid = false;
    }

    if (!valid) return;

    // ripple
    spawnRipple(btn, e);

    // loading state
    btn.disabled = true;
    document.getElementById('btnLabel').innerHTML =
      '<span class="btn-spinner"></span>Signing in…';

    // extract and store first name
    const firstName = extractFirstName(emailVal);
    localStorage.setItem('haiDashFirstName', firstName);
    localStorage.setItem('haiDashEmail', emailVal);

    // simulate auth delay → show success → redirect
    setTimeout(() => {
      // success overlay
      document.getElementById('successName').textContent = 'Welcome, ' + firstName + ' 👋';
      document.getElementById('successOverlay').classList.add('visible');

      // redirect after brief pause
      setTimeout(() => {
        window.location.href = 'headless.html';
      }, 1200);
    }, 1400);
  });

  /* ── auto-fill demo hint on focus (remove if not needed) ── */
  emailInput.addEventListener('focus', () => {
    if (!emailInput.value) {
      emailInput.placeholder = 'e.g. jayakrishna@ibm.com';
    }
  });
  emailInput.addEventListener('blur', () => {
    emailInput.placeholder = 'you@company.com';
  });
</script>
</body>
</html>
